<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aroma Andino Canchaque: Formulario cotización</title>
</head>
<body>
    <header>
        <a href="index.html">
            <img 
            src="assets/img/logo4.svg" 
            alt="Aroma Andino Canchaque"
            width="100">
        </a>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="pages/nosotros.html">Nuestra Historia</a></li>
                <li><a href="pages/productos.html">Nuestros Cafés</a></li>
                <li><a href="pages/contactos.html">Contáctenos</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <section>
    <h2>Cotiza tu Pedido o Escríbenos</h2>

        <form>
            <fieldset>
            <legend>Datos de Contacto y Reserva</legend>

            <p>
                <label for="contacto-nombre">Nombre completo:</label>
                <input type="text" id="contacto-nombre" name="nombre" required>
            </p>

            <p>
                <label for="contacto-email">Correo electrónico:</label>
                <input type="email" id="contacto-email" name="correo" required>
            </p>

            <p>
                <label for="contacto-telefono">Teléfono o WhatsApp (9 dígitos):</label>
                <input type="tel" id="contacto-telefono" name="telefono" pattern="[0-9]{9}" required>
            </p>

            <p>
                <label for="contacto-tipo">Tipo de cliente:</label>
                <select id="contacto-tipo" name="tipo" required>
                <option value="">-- Elige una opción --</option>
                <option value="personal">Consumo Personal</option>
                <option value="cafeteria">Cafetería / Restaurante</option>
                <option value="corporativo">Oficina Corporativa</option>
                </select>
            </p>

            <p>
                <label for="contacto-mensaje">Mensaje o detalle de granos requeridos:</label>
                <textarea id="contacto-mensaje" name="mensaje" rows="5" required></textarea>
            </p>

            <button type="submit">Enviar Solicitud Comercial</button>
            </fieldset>
        </form>
    </section>
</body>
</html>
